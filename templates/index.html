<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor Espacial - Ruido Tunja</title>
    <link rel="stylesheet" href="/static/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #panel-sql { padding: 12px; background: #1e293b; color: white; display: flex; flex-direction: column; gap: 8px; z-index: 1000; }
        .controles { display: flex; gap: 10px; align-items: center; }
        textarea { flex-grow: 1; height: 75px; font-family: monospace; font-size: 13px; padding: 8px; border-radius: 4px; border: none; }
        button { padding: 10px 18px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #059669; }
        .btn-ejemplo { background: #3b82f6; padding: 5px 10px; font-size: 12px; }
        .btn-ejemplo:hover { background: #2563eb; }
        #map { flex-grow: 1; width: 100%; background: #e2e8f0; }
        #error-msg { color: #f87171; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="panel-sql">
        <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
            <span style="font-size: 13px; font-weight: bold;">Consultas rápidas:</span>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(1)">1. Top 60 Ordinario Diurno</button>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(2)">2. Barrios por Sector</button>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(3)">3. Top 20 Más Ruidosos</button>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(4)">4. Top 20 Menos Ruidosos</button>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(5)">5. Barrios Sin Registro</button>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(6)">6. Equipamientos > 65 dB</button>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(7)">7. Buffer Educativo/Salud</button>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(8)">8. Común 4 Mediciones > 65</button>
            <button class="btn-ejemplo" onclick="seleccionarConsulta(9)">9. Común 4 Mediciones < 55</button>
        </div>
        <div class="controles">
            <textarea id="sql-input">SELECT punto_medicion.id_punto, punto_medicion.direccion, registro_ruido.valor_db, punto_medicion.geom FROM punto_medicion, registro_ruido, configuracion_escenario WHERE punto_medicion.id_punto = registro_ruido.id_punto AND registro_ruido.id_escenario = configuracion_escenario.id_escenario AND configuracion_escenario.metodo_registro ILIKE '%MEDICIÓN%' AND configuracion_escenario.jornada ILIKE '%DIURNO%' AND configuracion_escenario.tipo_dia ILIKE '%ORDINARIO%' ORDER BY registro_ruido.valor_db DESC LIMIT 60;</textarea>
            <button onclick="ejecutarConsulta()">Ejecutar SQL</button>
        </div>
        <span id="error-msg"></span>
    </div>

    <div id="map"></div>
    <script src="/static/leaflet.js"></script>
    <script>
        var CONSULTAS = {
            1: "SELECT punto_medicion.id_punto, punto_medicion.direccion, registro_ruido.valor_db, punto_medicion.geom FROM punto_medicion, registro_ruido, configuracion_escenario WHERE punto_medicion.id_punto = registro_ruido.id_punto AND registro_ruido.id_escenario = configuracion_escenario.id_escenario AND configuracion_escenario.metodo_registro ILIKE '%MEDICIÓN%' AND configuracion_escenario.jornada ILIKE '%DIURNO%' AND configuracion_escenario.tipo_dia ILIKE '%ORDINARIO%' ORDER BY registro_ruido.valor_db DESC LIMIT 60;",
            2: "SELECT barrios_tunja.sector, COUNT(barrios_tunja.id) AS cantidad_barrios, (SELECT COUNT(punto_medicion.id_punto) FROM punto_medicion WHERE ST_Within(punto_medicion.geom, ST_Union(barrios_tunja.geom))) AS cantidad_puntos_medicion, ST_Union(barrios_tunja.geom) AS geom FROM barrios_tunja GROUP BY barrios_tunja.sector ORDER BY cantidad_puntos_medicion DESC;",
            3: "SELECT barrios_tunja.id, barrios_tunja.nombre AS barrio, barrios_tunja.sector, barrios_tunja.poblacion, COUNT(ruido_ordinario_diurno.id_punto) AS cantidad_puntos, ROUND(AVG(ruido_ordinario_diurno.valor_db)::numeric, 1) AS promedio_db, MAX(ruido_ordinario_diurno.valor_db) AS maximo_db, barrios_tunja.geom FROM barrios_tunja, ruido_ordinario_diurno WHERE ST_Within(ruido_ordinario_diurno.geom, barrios_tunja.geom) GROUP BY barrios_tunja.id, barrios_tunja.nombre, barrios_tunja.sector, barrios_tunja.poblacion, barrios_tunja.geom ORDER BY promedio_db DESC LIMIT 20;",
            4: "SELECT barrios_tunja.id, barrios_tunja.nombre AS barrio, barrios_tunja.sector, barrios_tunja.poblacion, COUNT(ruido_ordinario_diurno.id_punto) AS cantidad_puntos, ROUND(AVG(ruido_ordinario_diurno.valor_db)::numeric, 1) AS promedio_db, MIN(ruido_ordinario_diurno.valor_db) AS minimo_db, barrios_tunja.geom FROM barrios_tunja, ruido_ordinario_diurno WHERE ST_Within(ruido_ordinario_diurno.geom, barrios_tunja.geom) GROUP BY barrios_tunja.id, barrios_tunja.nombre, barrios_tunja.sector, barrios_tunja.poblacion, barrios_tunja.geom ORDER BY promedio_db ASC LIMIT 20;",
            5: "SELECT barrios_tunja.id, barrios_tunja.nombre AS barrio, barrios_tunja.sector, barrios_tunja.poblacion, barrios_tunja.viviendas, barrios_tunja.geom FROM barrios_tunja WHERE NOT EXISTS (SELECT 1 FROM punto_medicion WHERE ST_Within(punto_medicion.geom, barrios_tunja.geom)) ORDER BY barrios_tunja.nombre ASC;",
            6: "SELECT equipamientos_tunja.id, equipamientos_tunja.equipamien AS tipo, COALESCE(equipamientos_tunja.equip, equipamientos_tunja.observa, 'Sin nombre') AS nombre, ruido_ordinario_diurno.valor_db AS db, ruido_ordinario_diurno.direccion AS direccion, ROUND(ST_Distance(equipamientos_tunja.geom::geography, ruido_ordinario_diurno.geom::geography)::numeric, 1) AS distancia, equipamientos_tunja.geom FROM equipamientos_tunja, ruido_ordinario_diurno WHERE ST_DWithin(equipamientos_tunja.geom::geography, ruido_ordinario_diurno.geom::geography, 50) AND ruido_ordinario_diurno.valor_db > 65 ORDER BY ruido_ordinario_diurno.valor_db DESC, distancia ASC;",
            7: "SELECT ST_Buffer(top_puntos.geom::geography, 50)::geometry AS geom, barrios_tunja.nombre AS nombre_barrio, top_puntos.id_punto, top_puntos.valor_db, top_puntos.direccion AS direccion_punto, equipamientos_tunja.equipamien AS tipo_equipamiento, COALESCE(equipamientos_tunja.equip, equipamientos_tunja.observa, 'Sin nombre') AS nombre_equipamiento FROM (SELECT ruido_ordinario_diurno.id_punto, ruido_ordinario_diurno.valor_db, ruido_ordinario_diurno.direccion, ruido_ordinario_diurno.geom FROM ruido_ordinario_diurno ORDER BY ruido_ordinario_diurno.valor_db DESC LIMIT 20) AS top_puntos, equipamientos_tunja, barrios_tunja WHERE ST_Intersects(ST_Buffer(top_puntos.geom::geography, 50)::geometry, equipamientos_tunja.geom) AND ST_Intersects(equipamientos_tunja.geom, barrios_tunja.geom) AND (equipamientos_tunja.equipamien ILIKE '%Educativo%' OR equipamientos_tunja.equipamien ILIKE '%Salud%') ORDER BY top_puntos.valor_db DESC;",
            8: "SELECT ruido_ordinario_diurno.geom AS geom, ruido_ordinario_diurno.id_punto, ruido_ordinario_diurno.direccion, ruido_ordinario_diurno.valor_db AS db_ord_diurno, ruido_ordinario_nocturno.valor_db AS db_ord_nocturno, ruido_dominical_diurno.valor_db AS db_dom_diurno, ruido_dominical_nocturno.valor_db AS db_dom_nocturno FROM ruido_ordinario_diurno, ruido_ordinario_nocturno, ruido_dominical_diurno, ruido_dominical_nocturno WHERE ST_Equals(ruido_ordinario_diurno.geom, ruido_ordinario_nocturno.geom) AND ST_Equals(ruido_ordinario_diurno.geom, ruido_dominical_diurno.geom) AND ST_Equals(ruido_ordinario_diurno.geom, ruido_dominical_nocturno.geom) AND ruido_ordinario_diurno.valor_db > 65 AND ruido_ordinario_nocturno.valor_db > 65 AND ruido_dominical_diurno.valor_db > 65 AND ruido_dominical_nocturno.valor_db > 65 ORDER BY ruido_ordinario_diurno.valor_db DESC;",
            9: "SELECT ruido_ordinario_diurno.geom AS geom, ruido_ordinario_diurno.id_punto, ruido_ordinario_diurno.direccion, ruido_ordinario_diurno.valor_db AS db_ord_diurno, ruido_ordinario_nocturno.valor_db AS db_ord_nocturno, ruido_dominical_diurno.valor_db AS db_dom_diurno, ruido_dominical_nocturno.valor_db AS db_dom_nocturno FROM ruido_ordinario_diurno, ruido_ordinario_nocturno, ruido_dominical_diurno, ruido_dominical_nocturno WHERE ST_Equals(ruido_ordinario_diurno.geom, ruido_ordinario_nocturno.geom) AND ST_Equals(ruido_ordinario_diurno.geom, ruido_dominical_diurno.geom) AND ST_Equals(ruido_ordinario_diurno.geom, ruido_dominical_nocturno.geom) AND ruido_ordinario_diurno.valor_db < 55 AND ruido_ordinario_nocturno.valor_db < 55 AND ruido_dominical_diurno.valor_db < 55 AND ruido_dominical_nocturno.valor_db < 55 ORDER BY ruido_ordinario_diurno.valor_db DESC;"
        };

        var map = L.map('map').setView([5.5353, -73.3678], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        window.miCapaGeoJSON = null;

        function seleccionarConsulta(numero) {
            document.getElementById('sql-input').value = CONSULTAS[numero];
            ejecutarConsulta();
        }

        function extraerDecibeles(props) {
            if (!props) return null;
            if (props.valor_db !== undefined) return props.valor_db;
            if (props.promedio_db !== undefined) return props.promedio_db;
            if (props.db !== undefined) return props.db;
            if (props.db_ord_diurno !== undefined) return props.db_ord_diurno;
            return null;
        }

        function obtenerColorRuido(db) {
            if (db === null || db === undefined) return "#2563eb";
            if (db >= 70) return "#dc2626";
            if (db >= 65) return "#f97316";
            if (db >= 55) return "#eab308";
            return "#16a34a";
        }

        async function ejecutarConsulta() {
            var errorSpan = document.getElementById('error-msg');
            var sql = document.getElementById('sql-input').value;
            errorSpan.textContent = 'Consultando base de datos...';

            try {
                var respuesta = await fetch('/ejecutar_sql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sql: sql })
                });

                var datos = await respuesta.json();

                if (!respuesta.ok) {
                    errorSpan.textContent = "Error SQL: " + (datos.error || "Desconocido");
                    return;
                }

                errorSpan.textContent = '';

                if (window.miCapaGeoJSON) {
                    map.removeLayer(window.miCapaGeoJSON);
                }

                window.miCapaGeoJSON = L.geoJSON(datos, {
                    pointToLayer: function (feature, latlng) {
                        var db = extraerDecibeles(feature.properties);
                        return L.circleMarker(latlng, {
                            radius: 7,
                            fillColor: obtenerColorRuido(db),
                            color: "#1e293b",
                            weight: 1.5,
                            opacity: 1,
                            fillOpacity: 0.85
                        });
                    },
                    style: function (feature) {
                        var db = extraerDecibeles(feature.properties);
                        var colorPoligono = obtenerColorRuido(db);
                        return { 
                            color: colorPoligono, 
                            fillColor: colorPoligono,
                            weight: 2, 
                            fillOpacity: 0.45 
                        };
                    },
                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            var contenido = "<b>Detalles del registro:</b><br><hr style='margin:4px 0;'>";
                            for (var clave in feature.properties) {
                                contenido += "<b>" + clave + ":</b> " + feature.properties[clave] + "<br>";
                            }
                            layer.bindPopup(contenido);
                        }
                    }
                }).addTo(map);

                if (datos.features && datos.features.length > 0) {
                    map.fitBounds(window.miCapaGeoJSON.getBounds());
                } else {
                    errorSpan.textContent = "Consulta exitosa, pero la tabla no devolvió geometrías.";
                }

            } catch (err) {
                console.error(err);
                errorSpan.textContent = "Detalle del error: " + err.message;
            }
        }
    </script>
</body>
</html>
